{% extends "base.html" %}
{% block title %}Contact - AgriConnect{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4 border-0 shadow-sm rounded-4">
                <h3 class="fw-bold text-success mb-3">Get in Touch</h3>
                <p class="text-muted">Have inquiries regarding the AgriConnect platform or crop price data integration? Leave us a message.</p>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="Your name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="4" placeholder="Your message..."></textarea>
                    </div>
                    <button type="button" class="btn btn-success px-4">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
