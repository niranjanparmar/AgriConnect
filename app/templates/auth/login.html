{% extends "base.html" %}

{% block title %}Sign In - AgriConnect{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card card-agri border-0 shadow p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="display-6 text-success mb-2">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold">Sign In to AgriConnect</h3>
                    <p class="text-muted small">Select your role to access your personalized portal</p>
                </div>

                <!-- Role Selector Tabs -->
                <ul class="nav nav-pills nav-fill mb-4 bg-light p-1 rounded-pill" id="loginRoleTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link rounded-pill {% if role == 'farmer' %}active{% endif %}" id="farmer-tab" data-bs-toggle="pill" data-bs-target="#farmer-login" type="button" role="tab">
                            <i class="bi bi-person-fill-gear me-1"></i> Farmer
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link rounded-pill {% if role != 'farmer' %}active{% endif %}" id="consumer-tab" data-bs-toggle="pill" data-bs-target="#consumer-login" type="button" role="tab">
                            <i class="bi bi-bag-check-fill me-1"></i> Consumer
                        </button>
                    </li>
                </ul>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" value="demo.farmer@agriconnect.local" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label fw-semibold small mb-0">Password</label>
                            <a href="#" class="small text-decoration-none">Forgot password?</a>
                        </div>
                        <div class="input-group mt-1">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" value="password123" required>
                        </div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label small" for="rememberMe">Remember my login on this device</label>
                    </div>

                    <button type="submit" class="btn btn-agri w-100 py-2 fw-semibold mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Secure Login
                    </button>

                    <div class="text-center small text-muted">
                        Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-semibold text-success text-decoration-none">Register here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
