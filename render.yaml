services:
  - type: web
    name: agriconnect
    runtime: python
    buildCommand: "pip install -r requirements.txt && flask db upgrade && flask cli seed && flask cli sync-prices --source demo"
    startCommand: "gunicorn run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agriconnect-db
          property: connectionString

databases:
  - name: agriconnect-db
    databaseName: agriconnect
    user: agriconnect_user
    plan: free

